<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Rolê da Fala: pratique inglês sozinho, em dupla ou em grupo, em qualquer celular e com pouco gasto de internet.">
<title>Rolê da Fala</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&family=Lexend:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#EAF0F2; --surface:#FFFFFF; --surface2:#F3F7F8; --ink:#10262F; --ink2:#4B626C; --line:#D5E0E4;
  --brand:#0F4C6B; --brand-ink:#FFFFFF; --accent:#E8702A; --accent-soft:#FDE9DB;
  --ok:#1E8A5A; --ok-soft:#DDF3E8; --warn:#B7791F; --warn-soft:#FBEFD5; --bad:#B4372F; --bad-soft:#F9E1DE;
  --shadow:0 10px 40px rgba(15,76,107,.18);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A171D; --surface:#12262F; --surface2:#182F3A; --ink:#EAF3F6; --ink2:#9DB4BE; --line:#26414D;
    --brand:#5DB4DA; --brand-ink:#08222D; --accent:#FF9A57; --accent-soft:#3A2618;
    --ok:#5AD09B; --ok-soft:#173A2C; --warn:#F0BE62; --warn-soft:#3B2E14; --bad:#FF8A80; --bad-soft:#3F1E1B;
    --shadow:0 10px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0A171D; --surface:#12262F; --surface2:#182F3A; --ink:#EAF3F6; --ink2:#9DB4BE; --line:#26414D;
  --brand:#5DB4DA; --brand-ink:#08222D; --accent:#FF9A57; --accent-soft:#3A2618;
  --ok:#5AD09B; --ok-soft:#173A2C; --warn:#F0BE62; --warn-soft:#3B2E14; --bad:#FF8A80; --bad-soft:#3F1E1B;
  --shadow:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;padding-inline:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:center;padding-block:16px}
.side{max-width:340px;display:none}
.side h1{font-family:var(--display);font-size:34px;line-height:1.05;margin:0 0 8px;color:var(--brand);text-wrap:balance}
.side p{color:var(--ink2);margin:0 0 20px}
.side ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.side li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.side li b{display:block;font-family:var(--display);font-size:15px}
.side li span{color:var(--ink2);font-size:13.5px}
.side .credit{margin:22px 0 0;font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}
.side .ic{width:34px;height:34px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--brand);border:1px solid var(--line)}
@media (min-width:900px){ .side{display:block} }

.app{width:100%;max-width:390px;height:min(820px,calc(100vh - 32px));min-height:560px;background:var(--surface2);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:520px){ body{padding-inline:0} .stage{padding-block:0;align-items:stretch} .app{max-width:none;height:100vh;height:100dvh;border-radius:0;border:0;box-shadow:none} }

.top{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--brand);color:var(--brand-ink)}
.top h2{font-family:var(--display);font-size:18px;margin:0;flex:1;min-width:0;line-height:1.1;overflow-wrap:anywhere}
.top .chip{flex:none;padding:6px 9px}
.top .back{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.16);color:inherit}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;font-weight:700;font-size:12px;background:rgba(255,255,255,.18);color:inherit;min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.banner{padding:8px 14px;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.banner.off{background:var(--warn-soft);color:var(--warn)}
.banner.on{background:var(--ok-soft);color:var(--ok)}
main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
main>*{flex-shrink:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;font-weight:700;color:var(--ink2);min-height:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] svg{stroke-width:2.6}
.tab .dot{width:18px;height:3px;border-radius:2px;background:transparent}
.tab[aria-current="page"] .dot{background:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.h{font-family:var(--display);font-size:17px;margin:0 0 4px}
.muted{color:var(--ink2);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--brand);color:var(--brand-ink);min-height:46px}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--accent);color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.hello{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:16px;border:0}
.hello .h{font-size:22px;line-height:1.1}
.hello .muted{color:inherit;opacity:.85}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.lv{padding:9px 4px;border-radius:10px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.14);color:inherit;text-align:center;min-height:44px}
.lv[aria-pressed="true"]{background:#fff;color:#0F4C6B}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:104px}
.q svg{width:26px;height:26px;color:var(--accent)}
.q b{font-family:var(--display);font-size:15px}
.q span{font-size:12.5px;color:var(--ink2)}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;flex:none}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:9px 12px}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:transparent;border-radius:16px 16px 4px 16px}
.msg small{display:block;font-weight:700;font-size:11.5px;opacity:.75;margin-bottom:2px}
.audio{display:flex;align-items:center;gap:10px}
.audio .play{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.audio .play svg{width:16px;height:16px}
.wave{display:flex;align-items:center;gap:2px;height:24px;flex:1}
.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.5}
.composer{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.composer input,textarea{flex:1;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;min-width:0}
textarea{width:100%;resize:vertical;min-height:96px}
.ib{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);flex:none}
.ib.acc{background:var(--accent);color:#fff}
.ib svg{width:22px;height:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px;border-radius:9px;font-weight:700;color:var(--ink2);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px}
.recbtn{width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px var(--accent-soft)}
.recbtn svg{width:40px;height:40px}
.recbtn.on{background:var(--bad);box-shadow:0 0 0 8px var(--bad-soft);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px var(--bad-soft)}}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}.bar i{transition:none}}
.timer{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;padding:0 3px;border-radius:4px}
ins{background:var(--ok-soft);color:var(--ok);text-decoration:none;padding:0 3px;border-radius:4px;font-weight:700}
.tip{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--surface)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:18px;height:18px}
.phr{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rule button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:14px;font-weight:700;min-height:50px}
.rule .n{width:26px;height:26px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13px;flex:none}
.rule p{margin:0;padding:0 14px 14px 50px;color:var(--ink2);font-size:14px}
.incall{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.incall .timer{color:inherit}
.toast{position:absolute;left:14px;right:14px;bottom:72px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-weight:700;font-size:13.5px;text-align:center;z-index:5}
.w{display:inline;padding:0 1px;border-bottom:2px dotted var(--accent);font:inherit;color:inherit;cursor:pointer;background:none}
.msg.ai{background:var(--surface);max-width:92%}
.msg .tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--ink);border:1px solid var(--line);min-height:34px}
.msg.me .mini{background:rgba(255,255,255,.16);color:inherit;border-color:transparent}
.mini svg{width:14px;height:14px}
.chips{display:flex;flex-direction:column;gap:6px;padding:0 0 4px}
.sug{text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--brand);font-weight:600;font-size:13.5px;min-height:44px}
.fix{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:13px;color:var(--ink)}
.fix.good{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}
.score{display:inline}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink2)}
.scn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.scn .ib{color:#fff}
.flash{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:20px;width:100%}
.flash b{font-family:var(--display);font-size:28px}
.app{font-family:var(--body)}
.app.dys{--body:'Lexend','Verdana',system-ui,sans-serif;--display:'Lexend','Verdana',system-ui,sans-serif;letter-spacing:.03em;word-spacing:.12em;line-height:1.75}
.app.calm *{animation:none!important;transition:none!important}
.app.calm{filter:saturate(.7)}
.app.big{font-size:17px}
.app.big .btn,.app.big .tab,.app.big .ib,.app.big .lv,.app.big .opt{min-height:58px}
.app.hc .card,.app.hc .li,.app.hc .q,.app.hc .scn,.app.hc .opt,.app.hc .msg{border-width:2px;border-color:var(--ink)}
.app.hc .muted{color:var(--ink)}
.levels{grid-template-columns:repeat(4,1fr)}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.dots{display:flex;align-items:center;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots span{margin-left:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:50px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:56px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--accent-soft)}
.opt .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink2);display:grid;place-items:center;flex:none;background:var(--surface);color:var(--brand)}
.opt[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opt .box svg{width:16px;height:16px;stroke-width:3.2}
.pic{background:#F4F8FA;border-radius:22px;display:grid;place-items:center;padding:14px;border:1px solid var(--line)}
.pic svg{width:min(62%,180px);height:auto}
.bigword{font-family:var(--display);font-size:34px;font-weight:800;color:var(--brand)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>


<div class="stage">
  <aside class="side">
    <h1>Rolê da Fala</h1>
    <p data-side="lead"></p>
    <ul data-side="list"></ul>
    <p class="credit" data-side="credit"></p>
  </aside>
  <div class="app" id="app" role="application" aria-label="Rolê da Fala"></div>
</div>

<script>
(function(){
  var S = {
    lang:'pt', screen:'onb', room:null, offline:false, level:'zero', saver:true,
    pack:0, packPct:0, rules:0, toast:'', tab:'speak',

    rec:false, sec:0, call:{partner:0, video:false, active:false, sec:0},
    msgs:{
      conv:[

        {id:2,k:'write',done:false,pt:'Escreva sobre a sua comida favorita',en:'Write about your favorite food',mp:'Escrever · 10 min',me:'Writing · 10 min'},

    phrases:['Good morning! How are you?','Where is the bus stop?','Can you help me, please?','I would like some water.'],
    calls:[
      {pt:'Roda de conversa · Iniciantes',en:'Conversation circle · Beginners',when:{pt:'Quarta, 19h30',en:'Wednesday, 7:30 pm'},n:4},
      {pt:'Dupla rápida de speaking',en:'Quick speaking pair',when:{pt:'Hoje, 21h',en:'Today, 9 pm'},n:2}
    ],
    tut:{view:'pics',scn:null,chat:[],step:0,fc:0,flip:false,draft:'',done:false,fixes:0,tips:{}},
    xp:120, streak:3, mins:42,
    pics:{i:0,rev:false,res:null,busy:false,best:{}}, focus:{run:false,left:300}, rout:[false,false,false], showAll:false,
    vocab:[{w:'please',pt:'por favor',k:false},{w:'water',pt:'água',k:true},{w:'bus stop',pt:'ponto de ônibus',k:false}],
    partners:['Marina','Davi','Bia','Rafa'],
    topics:{pt:['Fale sobre o seu dia.','Qual comida você gosta mais?','Descreva o seu bairro.'],en:['Talk about your day.','What food do you like most?','Describe your neighborhood.']}
  };
  var colors=['#0F4C6B','#E8702A','#1E8A5A','#7A4EB0','#B4372F'];
  var DICT={nice:'legal',meet:'conhecer',great:'ótimo',hello:'olá',welcome:'bem-vindo',market:'mercado',today:'hoje',sure:'claro',tomatoes:'tomates',anything:'qualquer coisa',else:'mais',bag:'sacola',name:'nome',birth:'nascimento',help:'ajudar',doctor:'médico',wait:'esperar',yourself:'você mesmo',job:'emprego',strength:'ponto forte',students:'alunos',phones:'celulares',class:'aula',example:'exemplo',opinion:'opinião',point:'ponto',morning:'manhã',interesting:'interessante'};
  var PR={done:false,step:0,name:'',needs:{}};
  var NEEDS=[
    ['blind','Cegueira (uso por voz)','Blindness (voice use)','O app fala cada tela, descreve as figuras e usa botões grandes.','The app reads each screen aloud, describes pictures and uses large buttons.'],
    ['lowvis','Baixa visão','Low vision','Letras maiores, alto contraste e botões grandes.','Larger text, high contrast and large buttons.'],
    ['dys','Dislexia','Dyslexia','Fonte Lexend, mais espaço entre letras e palavras e botão para ouvir os textos.','Lexend font, more space between letters and words, and a button to hear texts.'],
    ['adhd','TDAH','ADHD','Uma tarefa por vez, sessões de 5 minutos, pausas e menos itens na tela.','One task at a time, 5-minute sessions, breaks and fewer items on screen.'],
    ['autism','Autismo (TEA)','Autism (ASD)','Rotina previsível, sem animações, linguagem direta e aviso antes de mudar de atividade.','Predictable routine, no animations, direct language and a heads-up before activity changes.'],
    ['deaf','Surdez ou dificuldade de ouvir','Deaf or hard of hearing','Tudo com texto e dicas visuais de pronúncia, sem depender de áudio.','Everything in text with visual pronunciation tips, without relying on audio.'],
    ['none','Prefiro não informar','Prefer not to say','Você pode mudar isso depois em Meu perfil.','You can change this later in My profile.']

    else if(a==='tnew'){S.tut.view='scn';S.screen='tutor';render()}
    else if(a==='tsug'){var sc2=SCN.filter(function(x){return x.id===S.tut.scn})[0];tutorSend(sc2.steps[S.tut.step].h[+v],false)}
    else if(a==='tsend'){var t2=S.tut.draft.trim();if(!t2){toast(tr('Escreva ou grave sua resposta.','Write or record your reply.'));return}tutorSend(t2,false)}
    else if(a==='tmic'){var sc3=SCN.filter(function(x){return x.id===S.tut.scn})[0];tutorSend(sc3.steps[S.tut.step].h[0],true)}
    else if(a==='trans'){S.tut.tips[v]=!S.tut.tips[v];render()}
    else if(a==='word'){var ex=S.vocab.some(function(x){return x.w===v});if(!ex)S.vocab.push({w:v,pt:DICT[v],k:false});speak(v);toast((ex?tr('Já está salva: ','Already saved: '):tr('Palavra salva: ','Word saved: '))+v+' = '+DICT[v])}
    else if(a==='flip'){S.tut.flip=!S.tut.flip;render()}
    else if(a==='fc'){var cur=S.vocab[S.tut.fc%S.vocab.length];cur.k=v==='1';S.tut.fc=(S.tut.fc+1)%S.vocab.length;S.tut.flip=false;S.xp+=2;render()}
    else if(a==='pack'){S.pack=1;S.packPct=0;packTimer=setInterval(function(){S.packPct+=12;if(S.packPct>=100){clearInterval(packTimer);S.pack=2;toast(tr('Pronto! Funciona sem internet.','Done! Works without internet.'))}else render()},300);render()}
  }

  function tutorSend(text,mic){
    var T=S.tut;
    if(S.offline&&S.pack!==2){toast(tr('Sem internet e sem pacote offline.','No internet and no offline pack.'));return}
    var sc=SCN.filter(function(x){return x.id===T.scn})[0], an=analyze(text), entry={r:'me',t:text,mic:mic};
    if(an){entry.fix=an.fix;entry.note=an.note;T.fixes++}
    if(mic){var words=text.replace(/[^A-Za-z' ]/g,'').split(' ').sort(function(a,b){return b.length-a.length});entry.weak=words[0];entry.score=78+Math.floor(Math.random()*19)}
    T.chat.push(entry);T.draft='';S.xp+=10;S.mins+=1;T.step++;
    if(T.step>=sc.steps.length){T.chat.push({r:'end'});T.done=true;S.xp+=20;S.streak=Math.max(S.streak,4)}
    else T.chat.push({r:'ai',i:T.step});
    render();
    var last=T.chat[T.chat.length-1];
    setTimeout(function(){speak(last.r==='end'?'Great job! That was a good conversation.':sc.steps[last.i].a)},250);
  }
  var side={
    pt:{credit:'Criado por Davi Alves Silveira, Glendha Paulino Tolentino, Pricilla Lopes Braga e Welberthy Gustavo de Freitas Morais, com orientação do Professor Humberto Nigri. A ideia é da Pricilla: reunir estudantes para estudar juntos e trocar conhecimento.',lead:'Protótipo criado por estudantes para praticar idiomas em comunidades e favelas.',list:[
      ['image','Figuras e pronúncia','Veja a figura, diga o nome em inglês e receba a correção.'],
      ['ai','Tutor de IA por voz','Converse em cenários do dia a dia, com correção na hora e nota de pronúncia.'],
      ['pack','Funciona sem internet','Pacote offline e fila de envio: o que você faz sem sinal é enviado quando volta.'],
      ['mic','Áudio em primeiro lugar','Falar, ouvir e repetir. Pouca digitação e pouca leitura.'],
      ['phone','Leve e econômico','Chamadas só de voz por padrão e modo de economia de dados.'],
      ['users','Inclusão de verdade','Cadastro com apoio para cegueira, autismo, dislexia, TDAH e surdez, além do Nível 0 para quem está começando.']]},
    en:{credit:'Created by Davi Alves Silveira, Glendha Paulino Tolentino, Pricilla Lopes Braga and Welberthy Gustavo de Freitas Morais, under the guidance of Professor Humberto Nigri. The idea is Pricilla\'s: bring students together to study and exchange knowledge.',lead:'Prototype created by students to practice languages in communities and favelas.',list:[
      ['image','Pictures and pronunciation','See the picture, say its name in English and get a correction.'],
      ['ai','Voice AI tutor','Chat in everyday scenarios with instant correction and a pronunciation score.'],
      ['pack','Works offline','Offline pack and send queue: what you do without signal is sent when you are back.'],
      ['mic','Audio first','Speak, listen and repeat. Little typing and little reading.'],
      ['phone','Light and low-cost','Voice-only calls by default and a data saver mode.'],
      ['users','Real inclusion','Sign-up with support for blindness, autism, dyslexia, ADHD and deafness, plus Level 0 for beginners.']]}
  };
  var iconMap={image:'image',ai:'spark',pack:'down',mic:'mic',phone:'phone',users:'users'};
  var _render=render;
  render=function(){
    _render();
    var s=side[S.lang];
    document.querySelector('[data-side="lead"]').textContent=s.lead;
    document.querySelector('[data-side="credit"]').textContent=s.credit;
    document.querySelector('[data-side="list"]').innerHTML=s.list.map(function(i){return '<li><div class="ic">'+ico(iconMap[i[0]])+'</div><div><b>'+i[1]+'</b><span>'+i[2]+'</span></div></li>'}).join('');
  };
  render();
})();
</script>
